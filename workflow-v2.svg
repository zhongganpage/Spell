<svg xmlns="http://www.w3.org/2000/svg" width="980" height="1300" viewBox="0 0 980 1300" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555"/>
    </marker>
    <marker id="arrd" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#999"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="1300" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="30" font-size="19" font-weight="bold" text-anchor="middle" fill="#111">Spell — workflow v2 (2026-08-08)</text>
  <text x="490" y="50" font-size="12" text-anchor="middle" fill="#666">blue = new in v2 · white = existing machinery · amber = the only way an idea dies</text>

  <!-- Working loop -->
  <rect x="60" y="70" width="400" height="80" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
  <text x="260" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Working loop</text>
  <text x="260" y="116" font-size="12" text-anchor="middle" fill="#333">portfolio 70/20/10 · GAP-owner champion</text>
  <text x="260" y="133" font-size="12" text-anchor="middle" fill="#333">M1–M12 toolkit · stuck ladder</text>

  <!-- Idea sprint -->
  <rect x="520" y="70" width="400" height="80" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="720" y="96" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c4e7d">Idea sprint · ≤10% budget</text>
  <text x="720" y="116" font-size="12" text-anchor="middle" fill="#333">E1 specialize · E2 reformulate (M5)</text>
  <text x="720" y="133" font-size="12" text-anchor="middle" fill="#333">E3 analogy/transfer · E4 wildcard · recombination</text>

  <!-- Draft -->
  <rect x="290" y="210" width="400" height="60" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="236" font-size="15" font-weight="bold" text-anchor="middle" fill="#111">Draft</text>
  <text x="490" y="254" font-size="12" text-anchor="middle" fill="#333">carries “what was tried and failed”</text>

  <!-- Hygiene linter -->
  <rect x="290" y="310" width="400" height="64" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="490" y="334" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c4e7d">Hygiene linter — deterministic</text>
  <text x="490" y="354" font-size="12" text-anchor="middle" fill="#333">units/dimensions · citations vs fetched · brackets vs tables</text>

  <!-- Tier gate -->
  <rect x="290" y="414" width="400" height="64" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="490" y="438" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c4e7d">Tier gate — round type → tier</text>
  <text x="490" y="458" font-size="12" text-anchor="middle" fill="#333">screening · fast · normal (user override, recorded)</text>

  <!-- Screening tier -->
  <rect x="40" y="520" width="230" height="70" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="155" y="544" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c4e7d">Screening tier</text>
  <text x="155" y="562" font-size="11.5" text-anchor="middle" fill="#333">claim-reviewer per claim (§1)</text>
  <text x="155" y="577" font-size="11.5" text-anchor="middle" fill="#333">default: exploratory rounds</text>

  <!-- Fast tier -->
  <rect x="710" y="520" width="230" height="70" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="825" y="544" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c4e7d">Fast tier</text>
  <text x="825" y="562" font-size="11.5" text-anchor="middle" fill="#333">2-agent A/B attack/rebut</text>
  <text x="825" y="577" font-size="11.5" text-anchor="middle" fill="#333">default: negative · repair-scoped</text>

  <!-- Panel container -->
  <rect x="290" y="520" width="400" height="230" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="542" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Normal tier — 5-agent panel + promoter</text>
  <rect x="310" y="556" width="360" height="38" rx="5" fill="#fafafa" stroke="#9aa4b2" stroke-width="1"/>
  <text x="490" y="580" font-size="12.5" text-anchor="middle" fill="#333">A1 counterexample-hunter · A2 step-validator · X/A3</text>
  <rect x="310" y="600" width="360" height="38" rx="5" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1"/>
  <text x="490" y="624" font-size="12.5" text-anchor="middle" fill="#1c4e7d">Promoter — champion → nearest true version</text>
  <rect x="310" y="644" width="360" height="38" rx="5" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1"/>
  <text x="490" y="668" font-size="12.5" text-anchor="middle" fill="#1c4e7d">R ranks promising-for-goal · idea scoreboard</text>
  <rect x="310" y="688" width="360" height="46" rx="5" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1"/>
  <text x="490" y="708" font-size="12.5" text-anchor="middle" fill="#1c4e7d">M — surgical manuscript</text>
  <text x="490" y="724" font-size="11" text-anchor="middle" fill="#333">diff-scoped · streamline folded in · [speculative] appendix</text>

  <!-- Surgical manuscript -->
  <rect x="290" y="770" width="400" height="54" rx="8" fill="#fafafa" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="802" font-size="14" font-weight="bold" text-anchor="middle" fill="#111">Surgical manuscript + change list</text>

  <!-- High-level check -->
  <rect x="290" y="860" width="400" height="64" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="490" y="884" font-size="15" font-weight="bold" text-anchor="middle" fill="#1c4e7d">High-level check — non-terminal</text>
  <text x="490" y="904" font-size="12" text-anchor="middle" fill="#333">novelty · sufficiency → pass / conditional / fail</text>

  <!-- User decision -->
  <rect x="40" y="860" width="230" height="64" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="155" y="884" font-size="13" font-weight="bold" text-anchor="middle" fill="#1c4e7d">conditional / fail → user</text>
  <text x="155" y="902" font-size="11.5" text-anchor="middle" fill="#333">repair (scope frozen) · park · re-scope</text>

  <!-- Deliverable -->
  <rect x="290" y="980" width="400" height="70" rx="8" fill="#eef9ee" stroke="#3a8f5a" stroke-width="1.5"/>
  <text x="490" y="1004" font-size="15" font-weight="bold" text-anchor="middle" fill="#1f5c33">Deliverable + decision list</text>
  <text x="490" y="1024" font-size="12" text-anchor="middle" fill="#333">manuscript · negative-value assessment</text>
  <text x="490" y="1040" font-size="12" text-anchor="middle" fill="#333">(negative rounds, all tiers) · progress report</text>

  <!-- Terminal state -->
  <rect x="60" y="1100" width="860" height="70" rx="8" fill="#fdf4ec" stroke="#d97706" stroke-width="1.5"/>
  <text x="490" y="1122" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a4b08">Only a demonstrated counterexample (reproducible computation) terminates an idea</text>
  <text x="490" y="1142" font-size="12" text-anchor="middle" fill="#333">fragments rule: maximal true subcase · obstruction · closest technique</text>
  <text x="490" y="1158" font-size="12" text-anchor="middle" fill="#333">→ wild-ideas register (≤15 active · revival triggers)</text>

  <!-- Lifecycle strip -->
  <rect x="60" y="1200" width="860" height="74" rx="8" fill="#eaf2fd" stroke="#3b82c4" stroke-width="1.5"/>
  <text x="490" y="1220" font-size="14" font-weight="bold" text-anchor="middle" fill="#1c4e7d">Idea / claim lifecycle</text>
  <text x="490" y="1240" font-size="12.5" text-anchor="middle" fill="#333">speculative → promising → claimed → under-review → accepted | rejected | counterexample</text>
  <text x="490" y="1258" font-size="11.5" text-anchor="middle" fill="#333">speculative: exempt, leaves by nomination · promising: heuristic use, labeled, never a delivered premise</text>

  <!-- ===== Arrows ===== -->
  <line x1="260" y1="150" x2="400" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="720" y1="150" x2="580" y2="205" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="270" x2="490" y2="305" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="374" x2="490" y2="409" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="478" x2="490" y2="515" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="446" x2="272" y2="515" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="446" x2="708" y2="515" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="750" x2="490" y2="765" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="824" x2="490" y2="855" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="490" y1="924" x2="490" y2="975" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="290" y1="892" x2="272" y2="892" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="825" y1="590" x2="700" y2="975" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="690" y1="900" x2="560" y2="1095" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <line x1="155" y1="520" x2="155" y2="155" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <line x1="155" y1="860" x2="155" y2="155" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrd)"/>
  <text x="150" y="330" font-size="10.5" fill="#888" transform="rotate(-90 150 330)">verdicts feed the loop</text>
  <text x="150" y="500" font-size="10.5" fill="#888" transform="rotate(-90 150 500)">user decides · revival triggers</text>
  <text x="620" y="1010" font-size="11" fill="#8a4b08">fast tier → NVA</text>
</svg>
